name: Build and deploy ASP.Net Core app to Azure Web App - todo-list-app

on:
  push:
    branches:
      - Deploy_Development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__connection: ${{secrets.AZURE_SQL_CONNECTION_STRING}}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: install Ef Tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore ./TodoList.Proj/TodoList.Proj.csproj

      - name: Build project
        run: dotnet build ./TodoList.Proj/TodoList.Proj.csproj --configuration Release

      - name: Execute Migration
        run: dotnet ef database update --project ./TodoList.Proj/TodoList.Proj.csproj
        
      - name: Publish project
        run: dotnet publish ./TodoList.Proj/TodoList.Proj.csproj -c Release -o ./publish --no-build

      - name: List contents of publish folder (build)
        run: ls -l ./publish

      - name: Clean publish folder
        run: |
          # Remove DLLs de teste
          find ./publish -type f -name '*Test*.dll' -exec rm -f {} \;
          # Remove PDBs de teste
          find ./publish -type f -name '*Test*.pdb' -exec rm -f {} \;



      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_04602A56518B46D28717C12BA24EC2B5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_833FA8A69D8340D9AA2FE752672B0216 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6543E819E35D4D4996663FE679EDBD83 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'todo-list-app'
          package: ./publish
          startup-command: 'dotnet TodoList.Proj.dll'









